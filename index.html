<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pszichológia órák – 10. osztály</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4FB; --ink:#16163A; --muted:#4F5279; --card:#FFFFFF; --line:#D5D8EE;
  --accent:#D42A68; --blue:#3550F5; --teal:#0B7F72;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);padding:clamp(24px,6vw,64px)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3rem);margin:0 0 .3em;letter-spacing:-.02em}
p.lead{color:var(--muted);max-width:60ch;font-size:1.1rem;margin:0 0 2em}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:960px}
a.card{display:block;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:24px 26px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:var(--accent)}
a.card .n{display:inline-block;font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--accent);margin-bottom:.5em}
a.card h2{font-family:var(--display);font-size:1.4rem;margin:0 0 .3em}
a.card p{margin:0;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
  <h1>Pszichológia órák</h1>
  <p class="lead">Interaktív, kattintható diasorok – 10. osztály. Válaszd ki az órát.</p>
  <div class="grid">
    <a class="card" href="pszichologia-bevezeto.html">
      <span class="n">1. ÓRA</span>
      <h2>Mi zajlik a fejedben?</h2>
      <p>Bevezetés a pszichológiába</p>
    </a>
    <a class="card" href="pszichologia-erzekeles.html">
      <span class="n">2. ÓRA</span>
      <h2>Érzékelés</h2>
      <p>Hogyan jut el a világ az agyunkig</p>
    </a>
    <a class="card" href="pszichologia-eszleles.html">
      <span class="n">3. ÓRA</span>
      <h2>Észlelés</h2>
      <p>Érzékelés vs. észlelés, Gestalt-elvek</p>
    </a>
  </div>
</body>
</html>
